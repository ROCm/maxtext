name: Decoupled Offline Tests

on:
  pull_request:
    paths:
      - 'maxtext/**'
      - '.github/workflows/**'
      - 'pyproject.toml'
      - 'README.md'
  push:
    branches: [ main ]
    paths:
      - 'maxtext/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  decoupled:
    runs-on: ubuntu-latest #will change
    container:
      image: rocm/jax:rocm7.0.2-jax0.6.0-py3.12-ubu24
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install dependencies (ROCm JAX base image)
        run: |
          python -m pip install --upgrade pip
          # Install core project in editable mode
          pip install -e . --no-cache-dir || pip install . --no-cache-dir
          # Install pinned stable stack requirements
          pip install -r requirements_with_jax_stable_stack_0.6.0.txt --no-cache-dir
          # Ensure pytest and plugins for csv/html reports
          pip install pytest pytest-html pytest-csv

      - name: Generate minimal parquet (optional)
        env:
          DECOUPLE_GCLOUD: TRUE
        run: |
          python maxtext/rocm/get_minimal_hf_c4_parquet.py --force --train-rows 200 --val-rows 40 || true

      - name: Run decoupled tests
        env:
          DECOUPLE_GCLOUD: TRUE
          LOCAL_GCLOUD_PROJECT: ci-decoupled
          # Direct test outputs (checkpoints/logs) into the decoupled logs directory inside repo
          LOCAL_BASE_OUTPUT: maxtext/rocm/gcloud_decoupled_test_logs
        run: |
          mkdir -p maxtext/rocm/gcloud_decoupled_test_logs
          echo "Starting decoupled pytest run" >> maxtext/rocm/gcloud_decoupled_test_logs/ci.log
          # Pre-collection to ensure at least one test is selected by the decoupled marker
          COLLECT_OUTPUT=$(pytest maxtext/tests -m decoupled --collect-only -q)
          TEST_COUNT=$(echo "$COLLECT_OUTPUT" | grep -v '^$' | wc -l)
          echo "Collected $TEST_COUNT decoupled tests" | tee -a maxtext/rocm/gcloud_decoupled_test_logs/ci.log
          if [ "$TEST_COUNT" -eq 0 ]; then
            echo "ERROR: No tests collected under -m decoupled. Failing build." | tee -a maxtext/rocm/gcloud_decoupled_test_logs/ci.log
            exit 2
          fi
          # Run tests producing CSV & HTML reports
          pytest -vv maxtext/tests -m decoupled -q \
            --csv=decoupled-tests-report.csv \
            --html=decoupled-tests-report.html --self-contained-html || EXIT=$?
          EXEC_COUNT=$(grep -E '^[^,]+,' decoupled-tests-report.csv | wc -l || true)
          echo "Executed $EXEC_COUNT testcases (exit=${EXIT:-0})" | tee -a maxtext/rocm/gcloud_decoupled_test_logs/ci.log
          # Summary for GitHub UI (link style hints; artifacts uploaded next step)
          {
            echo "### Decoupled Test Run Summary";
            echo "Collected: $TEST_COUNT";
            echo "Executed: $EXEC_COUNT";
            echo "Exit Code: ${EXIT:-0}";
            echo "Reports: CSV & HTML attached as artifacts.";
          } >> "$GITHUB_STEP_SUMMARY"
          mv decoupled-tests-report.csv decoupled-tests-report.html maxtext/rocm/gcloud_decoupled_test_logs/ 2>/dev/null || true
          echo "Pytest exit code: ${EXIT:-0}" >> maxtext/rocm/gcloud_decoupled_test_logs/ci.log
          exit ${EXIT:-0}

      - name: Upload decoupled logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decoupled-logs
          path: maxtext/rocm/gcloud_decoupled_test_logs
          if-no-files-found: warn